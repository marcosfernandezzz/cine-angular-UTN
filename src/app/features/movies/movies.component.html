<section class="page">
  <div class="heading">
    <p class="eyebrow">CARTELERA</p>
    <h1>Todas las peliculas</h1>
    <p>Busca por nombre o filtra por genero.</p>
  </div>

  <div class="filters">
    <input
      type="search"
      placeholder="Buscar..."
      [value]="search()"
      (input)="search.set($any($event.target).value)"
    >
    <select [value]="genre()" (change)="genre.set($any($event.target).value)">
      @for (item of genres(); track item) {
        <option [value]="item">{{ item }}</option>
      }
    </select>
  </div>

  <div class="grid">
    @for (movie of movies(); track movie.id) {
      <article class="card">
        <img [src]="movie.imageUrl" [alt]="movie.name">
        <div>
          <small>{{ movie.ageRating }} · {{ movie.durationMinutes }} min</small>
          <h2>{{ movie.name }}</h2>
          <p>{{ movie.synopsis }}</p>
          <a class="button" [routerLink]="['/peliculas', movie.id]">Detalle</a>
        </div>
      </article>
    }
  </div>
</section>
